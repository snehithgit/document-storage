name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: '"$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle pinned Apache-2.0 DocQuadNet model (build-time only)
        run: |
          mkdir -p app/src/main/assets/docquad
          curl --fail --location --retry 4 --silent --show-error \
            https://raw.githubusercontent.com/egdels/makeacopy/cdf0e66833e5a918b90643692e2894a25262f284/app/src/main/assets/docquad/docquadnet256_trained_opset17.ort \
            -o app/src/main/assets/docquad/docquadnet256_trained_opset17.ort
          test "$(git hash-object app/src/main/assets/docquad/docquadnet256_trained_opset17.ort)" = "1cfaaf7ff3fdc04c29749f62051e961fe60accdc" || exit 1
      - name: Test and assemble debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Android lint (fail on errors)
        run: gradle --no-daemon :app:lintDebug
      - name: Print lint diagnostics if lint fails
        if: failure()
        run: |
          find app/build -name 'lint-results-debug.txt' -print -exec cat {} \;
      - name: Enforce offline merged manifest
        run: |
          python3 - <<'PY'
          from glob import glob
          import xml.etree.ElementTree as ET
          paths=glob("app/build/intermediates/merged_manifests/debug/**/AndroidManifest.xml",recursive=True)
          assert paths, "Merged debug AndroidManifest.xml not found"
          ns="{http://schemas.android.com/apk/res/android}"
          for p in paths:
              tree=ET.parse(p)
              permissions=[x.attrib.get(ns+"name","") for x in tree.getroot() if x.tag.endswith("uses-permission")]
              assert "android.permission.INTERNET" not in permissions, "Network permission detected: "+p
          print("Verified merged manifest has no INTERNET permission.")
          PY
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DocumentVault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Package complete changed source files
        if: success() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import zipfile
          root=pathlib.Path(".")
          base=subprocess.check_output(["git","merge-base","origin/main","HEAD"],text=True).strip()
          changed=subprocess.check_output(["git","diff","--name-only","--diff-filter=ACM",base,"HEAD"],text=True).splitlines()
          with zipfile.ZipFile("DocumentVault-Phase0-complete-files.zip","w",zipfile.ZIP_DEFLATED) as archive:
              for name in changed:
                  source=root/name
                  if source.is_file():
                      archive.write(source,name)
          print("Packaged",len(changed),"changed files in full")
          PY
      - name: Upload complete Phase 0 changed files
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DocumentVault-Phase0-complete-files
          path: DocumentVault-Phase0-complete-files.zip
          retention-days: 30
      - name: Prepare optional stable release signing
        env:
          VAULT_SIGNING_KEYSTORE_BASE64: ${{ secrets.VAULT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$VAULT_SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$VAULT_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/document-vault.jks"
            chmod 600 "$RUNNER_TEMP/document-vault.jks"
            echo "VAULT_KEYSTORE_PATH=$RUNNER_TEMP/document-vault.jks" >> "$GITHUB_ENV"
          else
            echo "Release signing not configured; test APK only."
          fi
      - name: Assemble consistently signed release APK
        if: env.VAULT_KEYSTORE_PATH != ''
        env:
          VAULT_STORE_PASSWORD: ${{ secrets.VAULT_STORE_PASSWORD }}
          VAULT_KEY_ALIAS: ${{ secrets.VAULT_KEY_ALIAS }}
          VAULT_KEY_PASSWORD: ${{ secrets.VAULT_KEY_PASSWORD }}
        run: |
          test -n "$VAULT_STORE_PASSWORD"
          test -n "$VAULT_KEY_ALIAS"
          test -n "$VAULT_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Upload signed release APK
        if: env.VAULT_KEYSTORE_PATH != '' && success()
        uses: actions/upload-artifact@v4
        with:
          name: DocumentVault-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
